<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olli wird 5!</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        
        .btn:hover {
            background-color: #ff6f61; 
            color: #fff;
        }
    
   
        .invitation-image {
            max-height: 60vh; 
            width: auto;
            object-fit: contain; 
        }
    
    
        html, body {
            overflow-y: hidden; 
        }
    </style>
</head>
<body class="bg-[#1a2a44] min-h-screen flex items-center justify-center p-4">
    <div class="container mx-auto flex flex-col items-center justify-center gap-3 py-4 max-w-5xl">
        <div class="container mx-auto flex flex-col md:flex-row items-center justify-center gap-6 max-w-5xl">
            <img src="Olli1.png" alt="Olli wird 5!" class="invitation-image rounded-lg shadow-lg">
        </div>

        <div class="w-full flex flex-col items-center gap-4">
            <a href="https://mywishlists.de/wishs/view/006zHjtjfmg3fjFCnQeDTHoG" target="_blank" class="btn bg-[#f4c430] text-[#1a2a44] font-bold text-lg py-4 px-8 rounded-full transition-colors duration-300">
                Wunschliste
            </a>
            <a href="javascript:void(0)" onclick="downloadContact()" class="btn bg-[#f4c430] text-[#1a2a44] font-bold text-lg py-4 px-8 rounded-full transition-colors duration-300">
                Kontaktdaten Ollis Papa   
            </a>
            <a href="javascript:void(0)" onclick="downloadCalendarEvent()" class="btn bg-[#f4c430] text-[#1a2a44] font-bold text-lg py-4 px-8 rounded-full transition-colors duration-300">
    Geburtstagstermin speichern
            </a>
        </div>
    </div>

    <script>
        function downloadContact() {
            const vCard = `
BEGIN:VCARD
VERSION:3.0
FN:Philipp Ruge
TEL;TYPE=CELL:0152 03608310
END:VCARD
            `.trim();

            const blob = new Blob([vCard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'event_organizer.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>

    <script>
    function downloadCalendarEvent() {
        const icsContent = `
BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//YourCompany//BirthdayEvent//EN
BEGIN:VEVENT
UID:${new Date().getTime()}@yourdomain.com
DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z
DTSTART:20260709T150000Z
DTEND:20260709T180000Z
SUMMARY:Ollis Geburtstag
LOCATION:Hopplahopp, Kruppstraße 5, 31135 Hildesheim
DESCRIPTION:Ollis Geburtstag bei Hopplahopp von 15-18 Uhr.
END:VEVENT
END:VCALENDAR
        `.trim();

        const blob = new Blob([icsContent], { type: 'text/calendar' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ollis_geburtstag.ics';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
